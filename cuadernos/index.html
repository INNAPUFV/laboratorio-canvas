<style>
/* Identidad de marca v2.5: Anton · Cooper Hewitt · Open Sans. Interfaz con dos tarjetas carbón. */
@font-face{font-family:'Cooper Hewitt'; src:url('../assets/fonts/CooperHewitt-Heavy.woff2') format('woff2'); font-weight:800; font-display:swap}
:root{--yellow:#FDDA48;--ink:#0F1010;--stone:#393836;--stone-2:#2B2A28;--paper:#fff;--muted:#676762;--line:#D9D9D3;
  --f-label:'Cooper Hewitt','Open Sans',Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Open Sans',Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1080px;margin:auto;padding:20px clamp(14px,4vw,40px) 22px}
.label{font-family:var(--f-label);font-weight:800;text-transform:uppercase;letter-spacing:.14em;font-size:11.5px;line-height:1.3}

.topline{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px}
.tag{background:var(--yellow);padding:6px 10px;white-space:nowrap}

.cabecera{display:flex;align-items:baseline;justify-content:space-between;gap:4px 24px;flex-wrap:wrap;margin:16px 0 14px}
.cabecera h1{font:400 clamp(28px,4vw,42px)/1 'Anton',sans-serif;text-transform:uppercase;margin:0}
.cabecera p{margin:0;max-width:40ch;color:var(--muted);font-size:15px;line-height:1.5}

/* Dos tarjetas carbón, misma estructura: cuadro amarillo con el logo → rótulo → título → texto → acción */
.cuadernos{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cuaderno{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;gap:18px;padding:18px 22px;
  background:var(--stone);color:#fff;text-decoration:none;border-top:5px solid var(--yellow);transition:background .2s}
.cuaderno .ico{flex:none;width:60px;height:60px;background:var(--yellow);display:grid;place-items:center}
.cuaderno .ico svg{width:34px;height:27px;color:var(--ink)}
.cuaderno .txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.cuaderno .num{position:absolute;right:14px;bottom:-.2em;z-index:-1;font:400 100px/1 'Anton',sans-serif;color:rgba(255,255,255,.06);pointer-events:none}
.cuaderno h2{font:400 clamp(24px,3vw,30px)/1.05 'Anton',sans-serif;text-transform:uppercase;margin:0}
.cuaderno p{margin:0;color:#E7E6E1;font-size:14.5px;line-height:1.45}
.ir{padding-top:6px;display:inline-flex;align-items:center;gap:8px;color:var(--yellow);font:800 12px/1.2 var(--f-label);letter-spacing:.14em;text-transform:uppercase}
.fl{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.cuaderno:hover{background:var(--stone-2)}
.cuaderno:hover .fl{transform:translate(3px,-3px)}
.cuaderno:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

@media(max-width:600px){
  main{padding:12px 10px 16px}
  .topline .label{font-size:10px}
  .cuadernos{grid-template-columns:1fr;gap:10px}
  .cuaderno{padding:16px 16px;gap:14px}
  .cuaderno .ico{width:50px;height:50px}
}
@media(prefers-reduced-motion:reduce){.cuaderno,.fl{transition:none}}
</style>
</head>
