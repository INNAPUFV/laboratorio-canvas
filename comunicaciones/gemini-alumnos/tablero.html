<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- No indexar en buscadores -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Gemini ya disponible · Banner para el tablero de Canvas · UFV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;600;700&family=Playfair+Display:wght@400;500;600&family=Roboto+Slab:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#003865; --night:#001a33; --sky:#649eff; --accent:#cf2359; --on-dark:#cfe0f2;
    --body:"Arimo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --title:"Playfair Display",Georgia,"Times New Roman",serif;
    --slab:"Roboto Slab",Georgia,serif;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{margin:0; height:100%; background:#fff}
  body{font-family:var(--body); -webkit-font-smoothing:antialiased; overflow:hidden}
  a:focus-visible{outline:3px solid var(--sky); outline-offset:3px}

  /* Banner: ocupa siempre el alto del iframe */
  .banner{position:relative; overflow:hidden; height:100%; border-radius:16px; color:#fff;
    background:linear-gradient(135deg,#001a33 0%,#002a52 55%,#003865 100%);
    display:grid; grid-template-columns:1fr auto; column-gap:32px;
    padding:28px 34px}
  /* Anillos concéntricos */
  .banner::before{content:""; position:absolute; top:-170px; right:-130px; width:440px; height:440px; border-radius:50%;
    border:1px solid rgba(100,158,255,.26);
    box-shadow:0 0 0 60px rgba(100,158,255,.05),0 0 0 120px rgba(100,158,255,.035),0 0 0 180px rgba(100,158,255,.025)}
  .banner > *{position:relative; z-index:1}

  .texto{align-self:center; min-width:0}
  .eyebrow{margin:0 0 10px; font-family:var(--slab); font-weight:700; font-size:.74rem; letter-spacing:.14em; text-transform:uppercase; color:var(--sky)}
  h1{margin:0 0 12px; font-family:var(--title); font-weight:500; font-size:2.05rem; line-height:1.1; letter-spacing:-.01em; text-wrap:balance}
  h1 em{font-style:normal; color:var(--sky)}
  .raya{width:52px; height:3px; background:var(--sky); margin:0 0 12px}
  .sub{margin:0; font-size:.98rem; line-height:1.5; color:var(--on-dark)}
  .sub strong{color:#fff}

  /* Acciones */
  .acciones{align-self:center; display:flex; flex-direction:column; gap:10px; width:250px}
  .acc{display:flex; align-items:center; gap:12px; padding:11px 16px 11px 12px; border-radius:999px; text-decoration:none;
    font-weight:700; font-size:.92rem; line-height:1.15; color:var(--night); background:#fff; transition:background .18s,transform .18s}
  .acc:hover{background:#eef3fa; transform:translateX(3px)}
  .acc.prim{background:var(--accent); color:#fff}
  .acc.prim:hover{background:#b01d4c}
  .acc .ico{flex:none; width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:#eef3fa; color:var(--primary)}
  .acc.prim .ico{background:rgba(255,255,255,.18); color:#fff}
  .acc svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
  .acc .txt{flex:1; min-width:0}
  .acc small{display:block; font-weight:400; font-size:.74rem; opacity:.75; margin-top:2px}
  .acc .flecha{flex:none; width:15px; height:15px}


  /* Tablet */
  @media (max-width:720px){
    .banner{column-gap:22px; padding:24px}
    h1{font-size:1.7rem}
    .acciones{width:210px}
    .acc small{display:none}
  }
  /* Móvil: una columna, botones en fila */
  @media (max-width:560px){
    .banner{grid-template-columns:1fr; grid-template-rows:1fr auto; padding:20px 18px}
    .banner::before{width:300px; height:300px; top:-150px; right:-140px}
    .texto{padding-bottom:14px; align-self:start}
    .eyebrow{font-size:.66rem; margin-bottom:8px}
    h1{font-size:1.38rem; margin-bottom:8px}
    .raya{display:none}
    .sub{font-size:.85rem}
    .acciones{flex-direction:row; width:auto; gap:8px}
    .acc{flex:1; flex-direction:column; gap:6px; padding:10px 4px; border-radius:14px; text-align:center; font-size:.76rem}
    .acc:hover{transform:none}
    .acc .flecha{display:none}
  }
  @media (prefers-reduced-motion:reduce){.acc{transition:none} .acc:hover{transform:none}}
</style>
</head>
<body>
<main class="banner">
  <div class="texto">
    <h1>Ya tienes <em>Gemini</em> y <em>Gemini Notebook</em></h1>
    <div class="raya" aria-hidden="true"></div>
    <p class="sub">Con Nano Banana y Deep Research. Entra siempre con tu <strong>cuenta de correo de la UFV</strong>.</p>
  </div>

  <nav class="acciones" aria-label="Accesos">
    <a class="acc prim" href="#" data-enlace="gemini">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg></span>
      <span class="txt">Abrir Gemini<small>gemini.google.com</small></span>
      <svg class="flecha" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
    <a class="acc" href="#" data-enlace="recursos">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6z"/></svg></span>
      <span class="txt">Recursos<small>y formaciones</small></span>
      <svg class="flecha" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
    <a class="acc" href="#" data-enlace="vita">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14M12 17.5h.01"/></svg></span>
      <span class="txt">Ayuda en VITA<small>incidencias técnicas</small></span>
      <svg class="flecha" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </nav>

</main>

<script>
/* ENLACES · externos → pestaña nueva; páginas de Canvas → ventana completa */
const ENLACES = {
  "gemini":   "https://gemini.google.com/app",                      // Abrir Gemini
  "recursos": "https://landings.edvolution.io/Welcome-Gemini-UFV",  // Recursos y formaciones
  "vita":     "https://vita-apps.ufv.es/s/portal_ufv"               // VITA (incidencias)
};
document.querySelectorAll('[data-enlace]').forEach(a => {
  const url = ENLACES[a.dataset.enlace];
  if (url) { a.href = url; a.target = /instructure\.com/.test(url) ? "_top" : "_blank"; a.rel = "noopener"; }
  else { a.addEventListener('click', e => e.preventDefault()); a.setAttribute('aria-disabled','true'); }
});
</script>
</body>
</html>
