<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- No indexar en buscadores -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="color-scheme" content="light">
<title>Unidades temáticas | Narrativa Periodística I</title>

<!--
  UNIDADES TEMÁTICAS · NARRATIVA PERIODÍSTICA I
  Identidad de marca v2.5. Los banners animados de cada unidad (antes GIF de 18–29 MB) son
  vídeos MP4 de 0,2–0,5 MB en media/ (u1…u4.mp4) con su imagen fija (u1…u4.jpg).
  Los vídeos solo se reproducen mientras están a la vista.
  ENLACES: rellenar en el bloque «const ENLACES» al final. Vacío = «Próximamente».
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Open+Sans:wght@400;600&display=swap">
<link rel="preload" href="../assets/fonts/CooperHewitt-Heavy.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Cooper Hewitt'; src:url('../assets/fonts/CooperHewitt-Heavy.woff2') format('woff2'); font-weight:800; font-display:swap}
:root{--yellow:#FDDA48;--ink:#0F1010;--stone:#393836;--stone-2:#2B2A28;--paper:#fff;--muted:#676762;--line:#D9D9D3;
  --f-label:'Cooper Hewitt','Open Sans',Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Open Sans',Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1080px;margin:auto;padding:20px clamp(14px,4vw,40px) 24px}
a{color:inherit;text-decoration:none}
.label{font-family:var(--f-label);font-weight:800;text-transform:uppercase;letter-spacing:.14em;font-size:11px;line-height:1.3}

.topline{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px}
.topline .label{font-size:11.5px}
.tag{background:var(--yellow);padding:6px 10px;white-space:nowrap}

/* Cabecera: banner carbón, como el de Unidades temáticas en la portada */
.cabecera{position:relative;overflow:hidden;isolation:isolate;margin-top:14px;padding:clamp(20px,3vw,28px) clamp(20px,3.4vw,32px);background:var(--stone);color:#fff;border-top:5px solid var(--yellow)}
.cabecera h1{font:400 clamp(32px,5vw,52px)/1 'Anton',sans-serif;text-transform:uppercase;margin:0}
.cabecera p{margin:8px 0 0;color:var(--yellow);font:800 clamp(13px,1.6vw,16px)/1.2 var(--f-label);letter-spacing:.1em;text-transform:uppercase}
.cabecera .marca{position:absolute;right:clamp(14px,3vw,30px);bottom:-.2em;z-index:-1;font:400 clamp(110px,15vw,160px)/1 'Anton',sans-serif;color:rgba(255,255,255,.06);pointer-events:none}

/* Unidades: banner animado de cada unidad + pie con el nombre y la acción */
.unidades{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.unidad{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--paper);transition:border-color .2s}
.banner{display:block;aspect-ratio:16/9;background:#F4F4F0;overflow:hidden}
.banner video{display:block;width:100%;height:100%;object-fit:cover}
.pie{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-top:2px solid var(--ink)}
.pie .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.pie .label{color:var(--muted)}
.titulo{font:400 clamp(17px,2vw,20px)/1.1 'Anton',sans-serif;text-transform:uppercase}
.ir{flex:none;display:inline-flex;align-items:center;gap:7px;font:800 11.5px/1.2 var(--f-label);letter-spacing:.14em;text-transform:uppercase}
.fl{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
a.unidad[href]:hover{border-color:var(--ink)}
a.unidad[href]:hover .fl{transform:translate(3px,-3px)}
a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.pendiente{cursor:default}
.pendiente .ir{opacity:.55}

@media(max-width:600px){
  main{padding:12px 10px 18px}
  .topline .label{font-size:10px}
  .unidades{grid-template-columns:1fr;gap:12px}
}
@media(prefers-reduced-motion:reduce){.fl,.unidad{transition:none}}
</style>
</head>
<body>
<main>
  <header class="topline"><span class="label">Narrativa Periodística I</span><span class="label tag">Estudia</span></header>

  <section class="cabecera" aria-labelledby="titulo">
    <h1 id="titulo">Unidades temáticas</h1>
    <p>Estudia. Practica. Aprende.</p>
  </section>

  <div class="unidades">
    <a class="unidad" data-enlace="u1">
      <span class="banner"><video src="media/u1.mp4" poster="media/u1.jpg" muted loop playsinline preload="none" aria-hidden="true"></video></span>
      <span class="pie">
        <span class="txt"><span class="label">Unidad 1</span><span class="titulo">Los géneros periodísticos</span></span>
        <span class="ir">Entrar <svg class="fl" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></span>
      </span>
    </a>
    <a class="unidad" data-enlace="u2">
      <span class="banner"><video src="media/u2.mp4" poster="media/u2.jpg" muted loop playsinline preload="none" aria-hidden="true"></video></span>
      <span class="pie">
        <span class="txt"><span class="label">Unidad 2</span><span class="titulo">La noticia</span></span>
        <span class="ir">Entrar <svg class="fl" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></span>
      </span>
    </a>
    <a class="unidad" data-enlace="u3">
      <span class="banner"><video src="media/u3.mp4" poster="media/u3.jpg" muted loop playsinline preload="none" aria-hidden="true"></video></span>
      <span class="pie">
        <span class="txt"><span class="label">Unidad 3</span><span class="titulo">La estructura de la noticia</span></span>
        <span class="ir">Entrar <svg class="fl" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></span>
      </span>
    </a>
    <a class="unidad" data-enlace="u4">
      <span class="banner"><video src="media/u4.mp4" poster="media/u4.jpg" muted loop playsinline preload="none" aria-hidden="true"></video></span>
      <span class="pie">
        <span class="txt"><span class="label">Unidad 4</span><span class="titulo">El estilo periodístico informativo</span></span>
        <span class="ir">Entrar <svg class="fl" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></span>
      </span>
    </a>
  </div>
</main>

<script>
/* ENLACES: pega entre comillas la dirección de cada unidad (pestaña nueva). Vacío = «Próximamente». */
const ENLACES = {
  "u1": "https://ufv-es.instructure.com/courses/70362/pages/unidad-1",   // Unidad 1 · Los géneros periodísticos
  "u2": "https://ufv-es.instructure.com/courses/70362/pages/unidad-2",   // Unidad 2 · La noticia
  "u3": "https://ufv-es.instructure.com/courses/70362/pages/unidad-3",   // Unidad 3 · La estructura de la noticia
  "u4": "https://ufv-es.instructure.com/courses/70362/pages/unidad-4"    // Unidad 4 · El estilo periodístico informativo
};
document.querySelectorAll('[data-enlace]').forEach(a => {
  const url = (ENLACES[a.dataset.enlace] || '').trim();
  const n = a.dataset.enlace.slice(1), t = a.querySelector('.titulo').textContent;
  if (url) { a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.setAttribute('aria-label', 'Entrar en la Unidad ' + n + ': ' + t + ' (se abre en una pestaña nueva)'); }
  else { a.classList.add('pendiente'); a.setAttribute('aria-disabled', 'true'); a.querySelector('.ir').textContent = 'Próximamente'; }
});

/* Banners animados: se cargan y reproducen solo cuando están a la vista; con animaciones
   desactivadas se queda la imagen fija. */
(function () {
  const videos = [...document.querySelectorAll('.banner video')];
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if (!('IntersectionObserver' in window)) { videos.forEach(v => { v.preload = 'auto'; v.play().catch(() => {}); }); return; }
  const io = new IntersectionObserver(es => es.forEach(e => {
    const v = e.target;
    if (e.isIntersecting) { v.preload = 'auto'; v.play().catch(() => {}); } else v.pause();
  }), { threshold: .25 });
  videos.forEach(v => io.observe(v));
})();
</script>
</body>
</html>
