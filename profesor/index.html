<style>
/* Identidad de marca v2.5: Anton · Cooper Hewitt · Open Sans. Cabecera del profesor, compacta. */
@font-face{font-family:'Cooper Hewitt'; src:url('../assets/fonts/CooperHewitt-Heavy.woff2') format('woff2'); font-weight:800; font-display:swap}
:root{--yellow:#FDDA48;--ink:#0F1010;--stone:#393836;--paper:#fff;--muted:#676762;--line:#D9D9D3;
  --f-label:'Cooper Hewitt','Open Sans',Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Open Sans',Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1080px;margin:auto;padding:20px clamp(14px,4vw,40px) 22px}
.label{font-family:var(--f-label);font-weight:800;text-transform:uppercase;letter-spacing:.14em;font-size:11.5px;line-height:1.3}

.topline{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px}
.edition{color:var(--stone)}
.tag{background:var(--yellow);padding:6px 10px;white-space:nowrap}

/* ---------- Bloque amarillo: nombre, lema y retrato animado ---------- */
.hero{position:relative;overflow:hidden;isolation:isolate;background:var(--yellow);margin-top:14px;
  display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px 28px;padding:clamp(22px,3.6vw,34px) clamp(22px,4vw,44px)}
/* trama de puntos blancos, arriba a la derecha (como en el original) */
.hero:before{content:"";position:absolute;top:0;right:0;width:46%;height:62%;z-index:-1;opacity:.7;
  background:radial-gradient(circle,#fff 1.3px,transparent 1.6px) 0 0/14px 14px;
  -webkit-mask:linear-gradient(225deg,#000 10%,transparent 70%);mask:linear-gradient(225deg,#000 10%,transparent 70%)}
.hero .label{display:inline-flex;align-items:center;gap:10px;margin:0 0 12px}
.hero .label:before{content:"";width:28px;height:2px;background:var(--ink)}
.hero h1{font:400 clamp(40px,6.4vw,70px)/.98 'Anton',sans-serif;text-transform:uppercase;margin:0;max-width:9ch}
.lema{display:flex;align-items:center;gap:14px;margin:18px 0 0}
.lema blockquote{margin:0;font-style:italic;font-size:clamp(16px,1.9vw,19px);line-height:1.45;max-width:26ch}
/* tres triángulos que se encienden en secuencia, señalando el lema */
.flechas{display:flex;gap:3px;flex:none}
.flechas i{width:0;height:0;border-left:8px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;opacity:.25;animation:enciende 1.8s infinite}
.flechas i:nth-child(2){animation-delay:.2s}
.flechas i:nth-child(3){animation-delay:.4s}
@keyframes enciende{0%,100%{opacity:.25}30%{opacity:1}}

/* retrato: dos arcos blancos que giran en sentidos opuestos + un aro que orbita */
.retrato{position:relative;width:clamp(200px,30vw,290px);aspect-ratio:1;flex:none}
.retrato img{position:absolute;inset:13%;width:74%;height:74%;border-radius:50%;object-fit:cover;display:block}
.retrato svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.retrato .a1,.retrato .a2{transform-origin:150px 150px;transform-box:view-box}
.retrato .a1{animation:gira 10s linear infinite}
.retrato .a2{animation:gira 16s linear infinite reverse}
.retrato .mas{transform-origin:236px 30px;transform-box:view-box;animation:salta 4s ease-in-out infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes salta{0%,70%{transform:rotate(0)}85%,100%{transform:rotate(90deg)}}

/* ---------- Franja de LinkedIn (negro puro) ---------- */
.linkedin{display:flex;align-items:stretch;margin-top:10px;background:var(--ink);color:#fff;text-decoration:none}
.linkedin .txt{flex:1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px clamp(18px,3vw,28px)}
.linkedin .label{font-size:clamp(12px,1.4vw,14px)}
.linkedin .flecha{flex:none;width:20px;height:20px;fill:none;stroke:var(--yellow);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.linkedin .logo{flex:none;width:clamp(64px,9vw,84px);background:var(--yellow);display:grid;place-items:center;transition:background .2s}
.linkedin .logo svg{width:46%;height:auto;color:var(--ink)}
.linkedin:hover .flecha{transform:translate(3px,-3px)}
.linkedin:hover .logo{background:#fff}
.linkedin:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

@media(max-width:600px){
  main{padding:12px 10px 16px}
  .topline .label{font-size:10px}
  .hero{grid-template-columns:1fr;justify-items:start;padding:24px 20px}
  .retrato{grid-row:1;width:190px}
  .hero:before{width:70%;height:40%}
}
@media(prefers-reduced-motion:reduce){
  .retrato .a1,.retrato .a2,.retrato .mas,.flechas i{animation:none}
  .flechas i{opacity:1}
}
</style>
